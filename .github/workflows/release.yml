name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build module ZIP (Ordner Flowkom/ im Root, wie FreeScout ihn erwartet)
        run: |
          mkdir -p /tmp/build/Flowkom
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' ./ /tmp/build/Flowkom/
          cd /tmp/build && zip -rq Flowkom.zip Flowkom
      - name: Version gegen module.json pruefen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import json; print(json.load(open('module.json'))['version'])")
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG != module.json $VERSION"; exit 1; fi
      - name: Release erstellen
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: /tmp/build/Flowkom.zip
          generate_release_notes: true
